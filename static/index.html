<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma fp Bridge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    margin: 0; padding: 20px; background: #161616; color: #e2e2e2;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: minmax(380px,1fr) minmax(380px,1fr); gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  h1 { font-size: 19px; margin: 0 0 8px; color: #fff; font-weight: 600; }
  h2 { font-size: 12px; margin: 0 0 12px; color: #9a9a9a; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  h3 { font-size: 11px; margin: 16px 0 6px; color: #7a7a7a; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  h3:first-child { margin-top: 0; }

  .panel { background: #202020; border: 1px solid #2e2e2e; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .panel.flush { padding: 0; overflow: hidden; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; min-height: 26px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; background: #2e2e2e; color: #b5b5b5; }
  .badge.ok { background: #16401f; color: #a8e8b4; }
  .badge.bad { background: #4a1a1a; color: #ffb8b8; }
  .badge.warn { background: #4a3c14; color: #ffdf9e; }
  .badge.info { background: #16304a; color: #a8d4ff; }
  .badge.rec { background: #5c1414; color: #ff9a9a; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .liveview { width: 100%; aspect-ratio: 16/9; background: #000; display: block; object-fit: contain; }
  .liveview-off { width: 100%; aspect-ratio: 16/9; background: #0c0c0c; display: flex; align-items: center; justify-content: center; color: #666; font-size: 13px; text-align: center; padding: 20px; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row > .label { color: #8e8e8e; flex: 1 1 auto; min-width: 0; }
  .row > .label small { display: block; color: #666; font-size: 10.5px; }
  .row > .value { color: #fff; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; text-align: right; flex: 0 0 auto; }

  button { background: #3a3a3a; color: #fff; border: 1px solid #484848; padding: 7px 13px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover:not(:disabled) { background: #464646; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button.danger { background: #b91c1c; border-color: #b91c1c; }
  button.danger:hover:not(:disabled) { background: #991b1b; }
  button.sm { padding: 4px 9px; font-size: 12px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

  select, input[type=number], input[type=text] {
    background: #171717; color: #fff; border: 1px solid #3d3d3d; padding: 5px 8px;
    border-radius: 6px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, monospace;
    min-width: 108px; max-width: 180px;
  }
  select:disabled, input:disabled { opacity: .4; cursor: not-allowed; }
  input[type=range] { width: 100%; accent-color: #2563eb; }

  .notice { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.5; display: flex; gap: 9px; align-items: flex-start; }
  .notice.warn { background: #38290c; border: 1px solid #5c4416; color: #ffe0a3; }
  .notice.err { background: #3a1414; border: 1px solid #5e2020; color: #ffc0c0; }
  .notice.info { background: #12283c; border: 1px solid #1e4467; color: #b8dcff; }
  .notice .fix { margin-top: 7px; }
  .notice-icon { flex: 0 0 auto; }
  /* 警告區高度變動時，瀏覽器不要為了「維持視覺位置」而捲動頁面 */
  #notices, #badges { overflow-anchor: none; }

  .log { background: #0e0e0e; border: 1px solid #2a2a2a; border-radius: 8px; padding: 9px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; height: 170px; overflow-y: auto; color: #8a8a8a; }
  .log .r { padding: 1.5px 0; }
  .log .r.send { color: #7fb8ff; }
  .log .r.recv { color: #8fd89b; }
  .log .r.err { color: #ff8f8f; }
  .log .r.warn { color: #ffd479; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 5px 7px; text-align: left; border-bottom: 1px solid #2a2a2a; }
  th { color: #808080; font-weight: 600; font-size: 11px; }
  .hint { color: #777; font-size: 11.5px; line-height: 1.5; }
  .seg { display: inline-flex; border: 1px solid #3d3d3d; border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 5px 11px; font-size: 12px; background: #202020; }
  .seg button.on { background: #2563eb; }
  code { background: #2a2a2a; padding: 1px 4px; border-radius: 3px; font-size: 11.5px; }

  /* 階層式選單：每一列是一個設定，選項橫向排開 */
  .opt { padding: 10px 0; border-bottom: 1px solid #262626; }
  .opt:last-child { border-bottom: none; }
  .opt-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .opt-name { font-size: 11px; color: #8a8a8a; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .opt-cur { font-size: 11.5px; color: #fff; font-family: ui-monospace, SFMono-Regular, monospace; }
  .opt-note { font-size: 11px; color: #6d6d6d; margin-left: auto; }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opts.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; scrollbar-width: thin; }
  .opts.scroll::-webkit-scrollbar { height: 6px; }
  .opts.scroll::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
  .o {
    flex: 0 0 auto; background: #2a2a2a; border: 1px solid #383838; color: #c8c8c8;
    padding: 5px 11px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, monospace; white-space: nowrap;
  }
  /* 未選：滑入變亮灰。已選：滑入變淺藍，不能被灰色蓋掉 ——
     .o:hover:not(:disabled) 的特異性 (0,3,0) 高於 .o.on 的 (0,2,0)，
     所以已選狀態的 hover 要另外寫，不能只靠宣告順序。 */
  .o:hover:not(:disabled):not(.on) { background: #353535; border-color: #4a4a4a; }
  .o.on { background: #2563eb; border-color: #3b82f6; color: #fff; font-weight: 600; }
  .o.on:hover:not(:disabled) { background: #3b82f6; border-color: #60a5fa; }
  .o:disabled { opacity: .3; cursor: not-allowed; }
  .o.locked { cursor: default; }
  .o.locked:hover, .o.locked.on:hover { background: #2a2a2a; border-color: #383838; }
  .o.locked.on, .o.locked.on:hover { background: #334155; border-color: #475569; }
  .o.locked.on { background: #334155; border-color: #475569; }
  /* 相機實際值跟這個選項接近但不相等 —— 例如選 29.97 相機存 30。
     還是要亮起來（不然整列看起來沒選中），但要看得出不是精確命中。 */
  .o.on.approx { background: #1e3a5f; border-color: #2563eb; font-weight: 500; }
  .o.on.approx:hover:not(:disabled) { background: #2c5388; border-color: #3b82f6; }
  .o.on.approx::after { content: '≈'; margin-left: 4px; opacity: .75; }
  .lockicon { font-size: 10px; opacity: .8; }
  .opts select { min-width: 120px; max-width: 160px; }
  /* 同一列裡的多個小群組：用細標籤與分隔線區隔，免得三排按鈕黏成一團 */
  /* 用 transform 置中，不要用負 margin：margin-top 的百分比是相對容器的
     **寬度**算的，不是高度。畫面 16:9 時垂直方向會多偏 1.78 倍 —— 對焦框
     會高出虛線框上緣、又碰不到下緣。transform 的百分比才是相對自己的尺寸。*/
  #lv-marker { position:absolute; width:34px; height:34px;
    transform:translate(-50%, -50%);
    border:2px solid #4da3ff; border-radius:3px; pointer-events:none; display:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6) }
  #lv-marker.snap { border-color:#7ee787 }
  /* 相機能對焦的範圍只有畫面的一部分，外圈那一圈點了也沒用。畫出來，
     使用者才知道那不是壞掉。 */
  #lv-afarea { position:absolute; border:1px dashed rgba(255,255,255,.35);
    pointer-events:none; display:none }
  #liveview.tap { cursor: crosshair }
  .grp { display: flex; align-items: center; gap: 5px; }
  .grp + .grp { margin-left: 4px; padding-left: 10px; border-left: 1px solid #333; }
  .grp-label { font-size: 11px; color: #8a8a8a; margin-right: 5px; align-self: center }
</style>
</head>
<body>
<div class="wrap">

  <h1>Sigma fp Bridge</h1>
  <div class="badges" id="badges"></div>
  <div id="notices"></div>

  <div class="grid">
    <div>
      <div class="panel flush">
        <div id="lv-wrap" style="position:relative; line-height:0">
          <img id="liveview" class="liveview" alt="">
          <div id="lv-afarea"></div>
          <div id="lv-marker"></div>
        </div>
        <div id="liveview-off" class="liveview-off"></div>
        <div class="btnrow" id="lv-tools" style="padding:8px 10px; line-height:normal">
          <button class="sm" id="btn-tapfocus">點選對焦：關</button>
          <span class="hint" id="tapfocus-hint"></span>
        </div>
      </div>

      <div class="panel">
        <h2>錄影</h2>
        <div class="btnrow">
          <button id="btn-rec" class="danger" onclick="toggleRec()">● 開始錄影</button>
          <span class="hint" id="rec-elapsed"></span>
        </div>
      </div>
      <div class="panel">
        <h2>對焦</h2>
        <div class="row">
          <span class="label">位置</span>
          <span class="value"><b id="f-pos">—</b> <span id="f-range-hint" class="hint"></span>
            <span id="f-lens" class="hint"></span></span>
        </div>
        <input type="range" id="pos-slider" min="0" max="2000" value="0" style="margin:12px 0 8px"
               oninput="onSliderInput()" onchange="onSliderCommit()">
        <div id="focus-controls" style="margin-top:12px; padding-top:12px; border-top:1px solid #2a2a2a"></div>
      </div>

    </div>

    <div>
      <div class="panel">
        <h2>相機控制權</h2>
        <div class="btnrow">
          <button id="btn-release" onclick="doRelease()">交還機身操作</button>
          <button id="btn-acquire" class="primary" onclick="send({cmd:'acquire'})">取回控制權</button>
          <button class="sm" onclick="send({cmd:'get_settings'})">↻ 重讀設定</button>
        </div>
        <div class="hint" style="margin-top:8px">
          bridge 連線時機身按鍵全部失效，這是協定限制不是 bug。交還時設定會自動保存、
          取回時還原 —— 但你在機身上改的東西不會保留，因為取回會讓相機重置。
        </div>
      </div>

      <div class="panel">
        <h2>相機設定</h2>
        <div id="settings"></div>
      </div>

      <div class="panel">
        <h2>Log</h2>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>
</div>

<script>
let ws = null, st = {}, schema = null, values = {};
let shutterUnit = 'time', renderedKey = null, busyUntil = 0, focusRange = null;

const $ = id => document.getElementById(id);
const busy = () => Date.now() < busyUntil;
function markBusy() { busyUntil = Date.now() + 4000; }

// 狀態廣播是 10Hz，render() 每次都跑。無條件寫 DOM 會讓節點每 100ms 被
// 銷毀重建 —— 版面因此抖動、捲軸亂飄，按鈕在你按下的瞬間被換掉所以按不到。
// 下面三個 helper 讓渲染變成冪等：值沒變就完全不碰 DOM。
function setHTML(el, html) { if (el.__last !== html) { el.innerHTML = html; el.__last = html; } }
function setText(el, v) { const t = (v === null || v === undefined) ? '—' : String(v); if (el.textContent !== t) el.textContent = t; }
function setDisabled(el, v) { v = !!v; if (el.disabled !== v) el.disabled = v; }
function setShown(el, v) { const d = v ? '' : 'none'; if (el.style.display !== d) el.style.display = d; }

function log(text, cls = '') {
  const el = document.createElement('div');
  el.className = 'r ' + cls;
  el.textContent = new Date().toLocaleTimeString() + '  ' + text;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  while ($('log').children.length > 250) $('log').removeChild($('log').firstChild);
}

// ── 連線 ──────────────────────────────────────────────────────────
function wireLiveview() {
  const img = $('liveview'), btn = $('btn-tapfocus');
  if (img && !img.__wired) { img.__wired = true; img.addEventListener('click', onLiveviewClick); }
  if (btn && !btn.__wired) { btn.__wired = true; btn.onclick = toggleTapFocus; }
}

function connect() {
  wireLiveview();
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => {
    log('WebSocket 已連線', 'recv');
    st.wsDown = false;
    send({cmd: 'describe_settings'});
    send({cmd: 'get_settings'});
    loadFocusBounds();
  };
  ws.onclose = () => { log('WebSocket 斷線，2 秒後重試', 'err'); st.wsDown = true; render(); setTimeout(connect, 2000); };
  ws.onerror = () => {};
  ws.onmessage = e => handle(JSON.parse(e.data));
}

function send(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('WebSocket 尚未就緒', 'err'); return; }
  obj.id = Math.floor(Math.random() * 1e9);
  ws.send(JSON.stringify(obj));
}

function handle(m) {
  switch (m.type) {
    case 'state': st = Object.assign({}, m, {wsDown: false}); render(); break;
    case 'hello': if (m.focus_range) applyRange(m.focus_range); break;
    case 'settings_schema':
      schema = m.settings;
      renderedKey = null; renderSettings(); break;
    case 'settings': values = m.settings; renderSettings(); break;
    case 'ack':
      if (m.schema) schema = m.schema;
      if (m.camera_mode) st.camera_mode = m.camera_mode;
      if (m.settings) { values = m.settings; renderSettings(); }
      reportRejections(m.rejected);
      if (m.clamped) log('⚠ ' + m.requested + ' 超出合法範圍，已修正為 ' + m.position, 'warn');
      if (m.recording !== undefined) log(m.recording ? '● 開始錄影' : '■ 停止錄影', 'recv');
      if (m.frame_rate !== undefined) setTimeout(() => send({cmd: 'get_settings'}), 150);
      break;
    case 'error': log('錯誤：' + m.error, 'err'); flash('err', m.error); break;
  }
}

function reportRejections(rejected) {
  if (!rejected || !Object.keys(rejected).length) return;
  for (const [k, d] of Object.entries(rejected)) {
    log('⚠ 相機沒有接受 ' + k + '=' + d.requested + '（實際 ' + d.actual + '）', 'warn');
    if (d.hint) log('   ' + d.hint, 'warn');
  }
  flash('warn', '有設定沒有生效，詳見下方 Log');
}

// ── 頂部狀態 ──────────────────────────────────────────────────────
const badge = (cls, text) => '<span class="badge ' + cls + '">' + text + '</span>';

function render() {
  const connected = !!st.connected && !st.wsDown;
  const live = connected && !st.released;

  const b = [];
  b.push(badge(connected ? 'ok' : 'bad',
    st.wsDown ? 'bridge 斷線' : connected ? '相機已連線' : '相機未連線'));
  if (st.released) b.push(badge('warn', '已交還機身'));
  if (st.camera_mode) b.push(badge('info', st.camera_mode === 'movie' ? 'CINE 錄影模式' : 'STILL 拍照模式'));
  if (st.recording) b.push('<span class="badge rec"><span class="dot pulse"></span>錄影中</span>');
  if (st.focal_length_mm) b.push(badge('', st.focal_length_mm + ' mm'));
  setHTML($('badges'), b.join(''));

  setShown($('liveview'), live);
  setShown($('liveview-off'), !live);
  if (live) { if (!$('liveview').getAttribute('src')) $('liveview').src = '/liveview.mjpeg'; }
  else if ($('liveview').getAttribute('src')) { $('liveview').removeAttribute('src'); }
  setText($('liveview-off'), st.released
    ? '已交還機身操作 — 沒有即時預覽。按「取回控制權」恢復。'
    : st.wsDown ? 'bridge 連線中斷' : '相機未連線');

  setText($('f-pos'), st.focus_position);
  // 馬達狀態和焦距都是在描述這一列講的那顆鏡頭 —— 各佔一列只是把同一件事
  // 拆開放。接在位置後面，兩列的空間就省下來了。
  setText($('f-lens'), [
    st.focus_state === 1 ? '對焦中' : st.focus_state === 0 ? '靜止' : '',
    st.focal_length_mm ? st.focal_length_mm + ' mm' : '',
  ].filter(Boolean).join(' · '));
  renderFocusControls();
  renderTapFocus();
  if (st.focus_range) applyRange(st.focus_range);
  if (st.focus_position != null && !busy()) $('pos-slider').value = st.focus_position;

  setText($('btn-rec'), st.recording ? '■ 停止錄影' : '● 開始錄影');
  setText($('rec-elapsed'), st.recording && st.recording_seconds != null
    ? Math.round(st.recording_seconds) + ' 秒' : '');

  // 錄影按鈕只看連線，不看 recording —— 否則要停止的時候反而按不下去
  for (const id of ['pos-slider'])
    setDisabled($(id), !live || st.recording);
  setDisabled($('btn-rec'), !live);
  setDisabled($('btn-release'), !connected || !!st.released);
  setDisabled($('btn-acquire'), !st.released);
  // 錄影中不讓人改設定：曝光在錄製途中變動會毀掉這一鏡
  const lockSettings = !live || !!st.recording;
  document.querySelectorAll('#settings [data-set]').forEach(el => {
    if (el.classList && el.classList.contains('locked')) return;   // 機身模式一直是鎖的
    // data-locked 是 renderSettings 依當下狀態標的（A 模式下的快門、
    // 自動 ISO 下的數值…）。這裡只能再加上停用，不能把它打開。
    setDisabled(el, lockSettings || el.dataset.locked === '1');
  });

  renderNotices();
}

function renderNotices() {
  const out = [];
  if (transient && Date.now() < transient.until) out.push(notice(transient.kind, transient.text, ''));
  else if (transient) transient = null;
  if (st.released) {
    out.push(notice('warn', '機身操作已交還給你',
      'bridge 仍在執行但完全放開相機 —— 沒有預覽、沒有對焦控制。取回時相機會被重置，' +
      '你先前的設定會自動還原，但<b>在機身上做的改動不會保留</b>。'));
  }
  if (st.recording) {
    out.push(notice('info', '錄影中', '設定已鎖定 —— 錄製途中改曝光會毀掉這一鏡。'));
  }
  const mode = values.exposure_mode;
  setHTML($('notices'), out.join(''));
}

function notice(kind, title, body, fix) {
  const icon = kind === 'err' ? '⛔' : kind === 'warn' ? '⚠️' : 'ℹ️';
  return '<div class="notice ' + kind + '"><span class="notice-icon">' + icon + '</span><div><b>' +
    title + '</b><br>' + (body || '') + (fix ? '<div class="fix">' + fix + '</div>' : '') + '</div></div>';
}

// 暫時訊息要納入 renderNotices 的計算，不能直接插進 DOM ——
// 否則下一次 10Hz 的重繪就把它抹掉了（原本的寫法就是這樣，訊息幾乎看不到）。
let transient = null;
function flash(kind, text) {
  transient = {kind: kind, text: text, until: Date.now() + 6000};
  renderNotices();
  setTimeout(renderNotices, 6100);
}

// ── 對焦 ──────────────────────────────────────────────────────────
function applyRange(r) {
  if (focusRange && focusRange[0] === r[0] && focusRange[1] === r[1]) return;
  focusRange = r;
  const s = $('pos-slider');
  s.min = r[0]; s.max = r[1];
  s.step = Math.max(1, Math.round((r[1] - r[0]) / 1000));
  $('f-range-hint').textContent = '（' + r[0] + ' – ' + r[1] + '）';
  log('焦點範圍 ' + r[0] + '–' + r[1], 'recv');
}

// 拖曳時就持續送位置，不用等放開 —— 這才是跟焦該有的手感。
//
// 敢這樣做是因為 bridge 的相機 worker 會合併同類指令：連發的位置設定只有
// 最新的那個會真的送上 USB，先前的以 applied=false 收場。對焦位置是絕對值
// 不是增量，所以丟掉中間值不影響結果。
//
// 仍然節流到每 50ms 一次：合併發生在 bridge 端，WebSocket 上還是少送為妙。
let sliderTimer = null, sliderPending = null;

function onSliderInput() {
  markBusy();
  sliderPending = parseInt($('pos-slider').value);
  if (sliderTimer) return;
  sliderTimer = setTimeout(() => {
    sliderTimer = null;
    if (sliderPending !== null) { send({cmd: 'set_position', position: sliderPending}); sliderPending = null; }
  }, 50);
}

function onSliderCommit() {
  // 放開時補送一次最終值 —— 節流可能把最後一次吃掉
  markBusy();
  if (sliderTimer) { clearTimeout(sliderTimer); sliderTimer = null; }
  sliderPending = null;
  const v = parseInt($('pos-slider').value);
  if (!isNaN(v)) send({cmd: 'set_position', position: v});
}

// ── 設定：階層式按鈕選單 ──────────────────────────────────────
// 由上而下：機身模式 → 曝光模式 → 影像規格 → 大小 → 幀率 → 位元深度 → 曝光數值。
// 每一列的選項都來自相機當下回報的合法值，所以上層一改，下層自動跟著變。
const ORDER = [
  ['__format',              '影像規格'],
  // DC 裁切和電子防手震都是在裁切感光範圍，而且會互相影響（CinemaDNG 下
  // 相機直接關掉電子防手震），所以緊接在影像規格後面、併成一列。
  ['__crop',                '裁切與防手震'],
  ['__exposure',            '曝光'],
  // mov_image_quality 不列在 UI：實測相機在所有格式 / 大小 / 幀率組合下
  // 都不開放調整它，值 1 / 2 的意義也沒有證據。顯示一個按不動又看不懂的
  // 控制項只會造成困惑。它仍可透過 API 讀寫，協定層的對應也留著。
  ['metering_mode',         '測光'],
  ['__wb',                  '白平衡'],
  // shutter_unit 併在曝光列的秒 / 角度按鈕裡；capture_mode 是最上層那列，都不另外列
  ['color_mode',            '色彩模式'],
  ['aspect_ratio',          '長寬比'],
  ['color_space',           '色彩空間'],
  ['tone_effect',           '色調'],
  ['drive_mode',            '驅動模式'],

  // ── 一直在 DataGroup4/5 裡但沒接出來的 ──────────────────────────
  ['high_iso_ext',          '高感光擴展'],
  ['cont_shoot_speed',      '連拍速度'],
  ['hdr',                   'HDR'],
  ['fill_light',            '補光'],
  ['__loc',                 '鏡頭校正'],
  ['interval_timer_seconds','間隔秒數'],
  ['interval_timer_frames', '間隔張數'],
];

// 太長的清單改成橫向捲動，不然一列會佔掉半個畫面
const SCROLL_IF_OVER = 9;

const ON_OFF = {On:'開', Off:'關', Auto:'自動', Null:'—'};

const FRIENDLY = {
  electronic_stabilization: ON_OFF,
  dc_crop_mode: ON_OFF,
  high_iso_ext: ON_OFF,
  loc_distortion: ON_OFF,
  loc_chromatic_aberration: ON_OFF,
  loc_diffraction: ON_OFF,
  loc_vignetting: ON_OFF,
  cont_shoot_speed: {Auto:'自動', High:'高', Medium:'中', Low:'低'},
  hdr: {Off:'關', Auto:'自動', Null:'—',
        PlusMinus1:'±1', PlusMinus2:'±2', PlusMinus3:'±3'},
  // fp 選單上的名字。1 和 13–16 是實測定出來的（見 camera_settings.FpColorMode）
  color_mode: {
    Standard:'標準', Vivid:'鮮豔', Neutral:'自然', Portrait:'人像', Landscape:'風景',
    Cinema:'電影', WarmGold:'暖金', TealAndOrange:'青橘', SunsetRed:'夕陽紅',
    ForestGreen:'森林綠', PowderBlue:'粉藍', FovClassicBlue:'FOV 經典藍',
    FovClassicYellow:'FOV 經典黃', Monochrome:'黑白', Off:'關（供調色）',
    Duotone:'雙色調',
  },
  focus_mode: {MF:'手動 MF', AF:'自動 AF', AF_S:'單次 AF-S', AF_C:'連續 AF-C'},
  face_eye_af: {Off:'關', FaceOnly:'僅臉部', FaceEyeAuto:'臉部+眼睛'},
  focus_area: {MultiAutoFocusPoints:'多點', OnePointSelection:'單點', Tracking:'追蹤'},
  exposure_mode: {ProgramAuto:'P', AperturePriority:'A', ShutterPriority:'S', Manual:'M'},
  iso_auto: {Auto:'自動', Manual:'手動'},
  image_quality: {DNG:'RAW DNG', JPEGFine:'JPEG 高', JPEGNormal:'JPEG 中',
                  JPEGBasic:'JPEG 低', DNGAndJPEG:'RAW+JPEG'},
  resolution: {High:'大', Medium:'中', Low:'小'},
  white_balance: {Auto:'自動', Sunlight:'日光', Shade:'陰影', Overcast:'陰天',
                  Incandescent:'白熾', Fluorescent:'螢光', Flash:'閃燈', ColorTemp:'色溫', LightSource:'光源',
                  Custom1:'自訂1', Custom2:'自訂2', Custom3:'自訂3'},
  metering_mode: {Evaluative:'權衡', CenterWeightedAverage:'中央重點',
                  CenterArea:'中央', Spot:'點測'},
};

// 相機回報 10 個曝光模式（含 Null / C1-C3 / Star），但實際會用的就這四個。
// 目前值若不在名單內仍會列出來 —— 否則使用者會看不到自己現在在哪一檔。
const CHOICE_WHITELIST = {
  exposure_mode: ['ProgramAuto', 'AperturePriority', 'ShutterPriority', 'Manual'],
};

// 只有 M 模式能手動設的項目（實測：其他模式下寫入會被自動曝光覆蓋）
const NEEDS_MANUAL = {shutter_speed: 1, shutter_angle: 1, aperture: 1};

// 不在這裡過濾快門 —— 秒數與角度合併進曝光那一列之後，該顯示哪一個由
// exposureRow() 決定。先前留著舊過濾的後果是：CINE 模式沒有 shutter_speed，
// 而預設單位是「秒」，於是 shutter_angle 被濾掉，整列憑空消失。
function visibleSettings() {
  return schema || [];
}

// 顯示用的比對：相機回報的值不一定精確等於選項（實測選 29.97 相機存 30）。
// 完全不亮會讓整列看起來沒選中，所以接近就亮，但用不同樣式標示。
//
// 這個寬鬆只用於顯示。伺服器端的回讀驗證仍然是嚴格比對 —— 值沒寫進去
// 該報還是要報，不能因為畫面好看就假裝成功。
const DISPLAY_EPSILON = 0.01;   // 相對誤差 1%

function matchState(choice, current) {
  if (current === null || current === undefined) return '';
  if (String(choice) === String(current)) return 'on';
  const a = Number(choice), b = Number(current);
  if (!isNaN(a) && !isNaN(b) && a !== 0 && b !== 0 &&
      Math.abs(a - b) / Math.max(Math.abs(a), Math.abs(b)) < DISPLAY_EPSILON) {
    return 'on approx';
  }
  return '';
}

function approxTitle(state, current) {
  return state === 'on approx' ? ' title="相機實際值 ' + escapeHTML(current) + '"' : '';
}

function labelFor(s, v) {
  const f = FRIENDLY[s.name];
  if (f && f[v] !== undefined) return f[v];
  if (s.labels && s.labels[v] !== undefined) return s.labels[v];
  if (s.inferred_labels && s.inferred_labels[v] !== undefined) return s.inferred_labels[v] + '?';
  if (s.unit === 's' && typeof v === 'number' && v > 0 && v < 1) return '1/' + Math.round(1 / v);
  if (s.unit === 'f') return 'f/' + v;
  if (s.unit === 'deg') return v + '°';
  if (s.unit === 'K') return v + 'K';
  if (s.unit === 'bit') return v + ' bit';
  if (s.unit === 'EV') return (v > 0 ? '+' : '') + Number(v).toFixed(1);
  if (s.unit === 'fps') return v + 'p';
  return String(v);
}

// 因為當下狀態而停用的控制項，要同時標上 data-locked ——
// render() 每 100ms 會重設所有控制項的 disabled，沒有這個標記就會把
// 「A 模式下快門不可設」之類的停用狀態清掉（實際發生過）。
function lockedAttr(isLocked) {
  return isLocked ? ' disabled data-locked="1"' : '';
}

function escapeHTML(t) {
  return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function optRow(name, title, opts) {
  // opts: {current, choices:[{value,label,title}], locked, disabled, note}
  const many = opts.choices.length > SCROLL_IF_OVER;
  const btns = opts.choices.map(c => {
    const state = matchState(c.value, opts.current);
    const on = state ? ' ' + state : '';
    const lock = opts.locked ? ' locked' : '';
    const dis = lockedAttr(opts.disabled || opts.locked);
    const t = c.title ? ' title="' + escapeHTML(c.title) + '"'
                      : approxTitle(state, opts.current);
    return '<button class="o' + on + lock + '"' + dis + t +
      ' data-set="' + name + '" data-val="' + escapeHTML(c.value) + '">' +
      escapeHTML(c.label) + '</button>';
  }).join('');
  const cur = opts.current === null || opts.current === undefined ? '—'
    : escapeHTML(opts.currentLabel !== undefined ? opts.currentLabel : opts.current);
  return '<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">' + title + '</span>' +
    '<span class="opt-cur">' + cur + '</span>' +
    (opts.note ? '<span class="opt-note">' + escapeHTML(opts.note) + '</span>' : '') +
    '</div><div class="opts' + (many ? ' scroll' : '') + '">' + btns + '</div></div>';
}

// 影像規格 / 大小 / 色彩位元合併成一列。它們是同一個決策的三個面向，
// 而且相機讓它們互相牽動 —— 改規格會改變可選的大小與位元深度，
// 分成三列反而看不出這層關係。
function formatRow(byName) {
  // 保留沒有可選值的群組 —— 相機在某些組合下會鎖死某個項目
  // （實測：UHD 下不開放調整色彩位元）。整組消失會讓人以為功能壞了，
  // 所以改成顯示目前值並標明不可調。
  // 不放群組標籤 —— 值本身就自我說明（CinemaDNG / FHD / 8 bit / 23.98），
  // 標題列又已經照同樣順序列出目前組合，分隔線足夠區分。
  const groups = [
    byName.record_format || byName.image_quality,
    byName.movie_resolution || byName.resolution,
    byName.cinema_dng_quality || byName.dng_quality,
    byName.frame_rate,
  ].filter(Boolean);
  if (!groups.length) return '';

  const cur = groups
    .map(s => {
      const v = values[s.name];
      return (v === null || v === undefined) ? null : labelFor(s, v);
    })
    .filter(Boolean).join(' · ');

  let locked = false;
  const body = groups.map(s => {
    const v = values[s.name];
    let btns;
    if (s.choices && s.choices.length) {
      btns = s.choices.map(c => {
        const state = matchState(c, v);
        return '<button class="o' + (state ? ' ' + state : '') + '"' +
          approxTitle(state, v) +
          ' data-set="' + s.name + '" data-val="' + escapeHTML(c) + '">' +
          escapeHTML(labelFor(s, c)) + '</button>';
      }).join('');
    } else {
      locked = true;
      const shown = (v === null || v === undefined) ? '—' : labelFor(s, v);
      btns = '<button class="o on locked" disabled title="' +
        escapeHTML('目前的規格 / 大小組合下，相機不開放調整這一項') + '">' +
        escapeHTML(shown) + '</button>';
    }
    return '<span class="grp">' + btns + '</span>';
  }).join('');

  return '<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">影像規格</span>' +
    '<span class="opt-cur">' + escapeHTML(cur || '—') + '</span>' +
    (locked ? '<span class="opt-note">灰色項目在此組合下鎖定</span>' : '') +
    '</div><div class="opts">' + body + '</div></div>';
}

// 曝光模式、光圈、快門合併成一列。模式決定另外兩個能不能手動設 ——
// P 下兩個都被自動曝光接管、A 只放光圈、S 只放快門、M 才全放。
// 放在一起，按下模式就看得到旁邊哪些變成可用。
function exposureRow(byName) {
  const mode = byName.exposure_mode;
  const ap = byName.aperture;
  const speed = byName.shutter_speed, angle = byName.shutter_angle;
  if (!mode && !ap && !speed && !angle && !byName.iso) return '';

  const cur = values.exposure_mode;
  const manual = cur === 'Manual';
  const apOK = manual || cur === 'AperturePriority';
  const shOK = manual || cur === 'ShutterPriority';

  const parts = [];
  if (cur) parts.push(labelFor(mode || {name:'exposure_mode'}, cur));
  if (ap && values.aperture !== null && values.aperture !== undefined)
    parts.push(labelFor(ap, values.aperture));

  // 模式
  let body = '';
  if (mode && mode.choices) {
    const white = CHOICE_WHITELIST.exposure_mode;
    let choices = mode.choices.filter(v => white.indexOf(String(v)) >= 0 || String(v) === String(cur));
    if (!choices.length) choices = mode.choices;
    body += '<span class="grp">' + choices.map(v =>
      '<button class="o' + (matchState(v, cur) ? ' ' + matchState(v, cur) : '') + '"' +
      ' data-set="exposure_mode" data-val="' + escapeHTML(v) + '">' +
      escapeHTML(labelFor(mode, v)) + '</button>').join('') + '</span>';
  }

  // ISO / EV —— 緊接在模式後面：模式決定相機接不接受手動 ISO
  const isoAuto = byName.iso_auto, iso = byName.iso, ev = byName.exposure_compensation;
  const autoIso = values.iso_auto === 'Auto';
  if (isoAuto || iso || ev) {
    let g = '';
    if (isoAuto) {
      g += (isoAuto.choices || ['Auto', 'Manual']).map(v =>
        '<button class="o' + (String(v) === String(values.iso_auto) ? ' on' : '') + '"' +
        ' data-set="iso_auto" data-val="' + v + '">' +
        (v === 'Auto' ? '自動' : '手動') + '</button>').join('');
    }
    if (iso && iso.choices && iso.choices.length) {
      const v = values.iso;
      if (v !== null && v !== undefined) parts.push('ISO ' + v);
      g += '<select data-set="iso"' + lockedAttr(autoIso) +
        ' title="' + escapeHTML(autoIso ? 'ISO 自動時由相機決定' : 'ISO') + '">' +
        optionsFor(iso.choices, v, c => 'ISO ' + c) + '</select>';
    }
    if (ev && ev.choices && ev.choices.length) {
      const v = values.exposure_compensation;
      if (v !== null && v !== undefined) parts.push('EV ' + labelFor(ev, v));
      g += '<select data-set="exposure_compensation" title="曝光補償">' +
        optionsFor(ev.choices, v, c => 'EV ' + labelFor(ev, c)) + '</select>';
    }
    if (g) body += '<span class="grp">' + g + '</span>';
  }

  // 光圈
  if (ap && ap.choices && ap.choices.length) {
    const v = values.aperture;
    body += '<span class="grp"><select data-set="aperture"' + lockedAttr(!apOK) +
      ' title="' + escapeHTML(apOK ? '光圈' : 'P / S 模式下由相機決定光圈') + '">' +
      optionsFor(ap.choices, v, c => labelFor(ap, c)) + '</select></span>';
  }

  // 快門：秒 / 角度切換 + 數值
  // 錄影模式下「秒 / 角度」不是顯示偏好，而是相機的實際設定
  // （DataGroupMovie tag 6）。切換等於寫入相機，所以按鈕要送設定而不是
  // 只改前端狀態 —— 這也是為什麼 CINE 下秒數原本按了沒用：相機根本在角度模式。
  const unitSetting = byName.shutter_unit;
  const cameraUnit = values.shutter_unit;   // 1 = 速度、2 = 角度
  const secondsAvailable = !!speed;
  const useAngle = unitSetting
    ? cameraUnit !== 1
    : (shutterUnit === 'angle' || !secondsAvailable);
  const active = useAngle ? angle : speed;
  if (active) {
    if (values[active.name] !== null && values[active.name] !== undefined)
      parts.push(labelFor(active, values[active.name]));
    // 相機有 shutter_unit 就寫入相機，沒有（拍照模式）就只切前端顯示
    const unitBtn = (u, label, on, tip) => {
      const attr = unitSetting
        ? ' data-set="shutter_unit" data-val="' + (u === 'angle' ? 2 : 1) + '"'
        : ' data-unit="' + u + '"';
      return '<button class="o' + (useAngle === (u === 'angle') ? ' on' : '') + '"' +
        lockedAttr(!on) + (tip ? ' title="' + escapeHTML(tip) + '"' : '') +
        attr + '>' + label + '</button>';
    };
    const v = values[active.name];
    body += '<span class="grp">' +
      unitBtn('time', '秒', unitSetting ? true : secondsAvailable,
              unitSetting ? '切換相機的快門表示法為速度' :
              (secondsAvailable ? '' : 'CINE 模式的快門只能用角度設定')) +
      unitBtn('angle', '角度', unitSetting ? true : !!angle,
              unitSetting ? '切換相機的快門表示法為角度' : '') +
      '<select data-set="' + active.name + '"' + lockedAttr(!shOK) +
      ' title="' + escapeHTML(shOK ? '快門' : 'P / A 模式下由相機決定快門') + '">' +
      optionsFor(active.choices, v, c => labelFor(active, c)) + '</select></span>';
  }

  const note = manual ? '' : (cur ? cur.replace('ProgramAuto','P 模式')
        .replace('AperturePriority','A 模式').replace('ShutterPriority','S 模式') +
        '：灰色項目由相機決定' : '');
  return '<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">曝光</span>' +
    '<span class="opt-cur">' + escapeHTML(parts.join(' · ') || '—') + '</span>' +
    (note ? '<span class="opt-note">' + escapeHTML(note) + '</span>' : '') +
    '</div><div class="opts">' + body + '</div></div>';
}

// 白平衡與色溫合併：色溫只有在白平衡設成 ColorTemp 時才會生效，
// 其他預設（自動 / 日光 / 陰影…）下相機自己決定色溫。分成兩列的話，
// 使用者會在色溫那格輸入數字然後發現沒反應。
// 四項鏡頭光學校正各佔一列太佔版面，而且它們是同一類東西、選項也一樣。
// 併成一列，每項只留下拉選單。
const LOC_PARTS = [
  ['loc_distortion',           '畸變'],
  ['loc_chromatic_aberration', '色差'],
  ['loc_diffraction',          '繞射'],
  ['loc_vignetting',           '暗角'],
];

const CROP_PARTS = [
  ['dc_crop_mode',             'DC 裁切'],
  ['electronic_stabilization', '電子防手震'],
];

// ── 在預覽畫面上點選對焦點 ─────────────────────────────────────────
//
// 座標映射有個已知的不確定性：對焦座標系是 682×1024（3:2，全片幅比例），
// 而 CINE 模式的 live view 是 16:9。相機宣告的有效區域（CanSetInfo5 613）
// 是上 85 下 597 左 96 右 928，長寬比 1.625 —— 跟兩者都不完全一致。
//
// 所以這裡把點擊位置正規化之後映射到「有效區域」，並在畫面上標出相機實際
// 採用的位置（它會吸附到格點）。映射若有偏差，marker 跟手指的落差會直接
// 看得出來 —— 這比假裝精確好。
let tapFocus = false;

function toggleTapFocus() {
  tapFocus = !tapFocus;
  renderTapFocus();
}

function renderTapFocus() {
  const btn = $('btn-tapfocus'), img = $('liveview'), marker = $('lv-marker');
  const area = $('lv-afarea');
  if (!btn) return;
  setText(btn, '點選對焦：' + (tapFocus ? '開' : '關'));
  btn.classList.toggle('primary', tapFocus);
  if (img) img.classList.toggle('tap', tapFocus);
  setText($('tapfocus-hint'), tapFocus
    ? '點虛線框內移動對焦點（相機會吸附到最近的格點）' : '');
  if (!marker) return;

  const b = (focusBounds && focusBounds.point) || {};
  const pt = st.focus_point;
  const show = tapFocus && pt && pt.length === 2 && b.height && b.width;
  // 不能用 setShown：它顯示時設 display=''，而 marker 的 CSS 是 display:none，
  // 空字串會退回樣式表那條規則 —— marker 因此永遠畫不出來。
  const want = show ? 'block' : 'none';
  if (marker.style.display !== want) marker.style.display = want;
  if (!show) { if (area) area.style.display = 'none'; return; }

  // 座標系是 682×1024（3:2，全片幅比例），但預覽畫面是 16:9 —— 它只顯示
  // 感光元件中間的一條。所以垂直方向要用「畫面實際看得到的高度」換算，
  // 不是座標系的全高，否則框會變形也會偏大。
  //
  // 可見高度 = 寬 ÷ 畫面長寬比。畫面 16:9 時就是 1024/(16/9) ≈ 576。
  const view = visibleSpan(b);
  const fy = (pt[0] - view.top) / Math.max(1, view.height);
  const fx = pt[1] / Math.max(1, b.width);
  marker.style.top = (fy * 100) + '%';
  marker.style.left = (fx * 100) + '%';

  // 相機的 AF 範圍（宣告的有效區）。外圈點了相機也會把點拉回來 ——
  // 畫出來才不會被當成 bridge 壞掉。
  if (area) {
    const t = (b.top !== undefined ? b.top : 0);
    const bo = (b.bottom !== undefined ? b.bottom : b.height);
    area.style.display = 'block';
    area.style.top = ((t - view.top) / Math.max(1, view.height) * 100) + '%';
    area.style.height = ((bo - t) / Math.max(1, view.height) * 100) + '%';
    area.style.left = ((b.left || 0) / Math.max(1, b.width) * 100) + '%';
    area.style.width = (((b.right || b.width) - (b.left || 0))
                        / Math.max(1, b.width) * 100) + '%';
  }

  const sizes = b.point_sizes || [];
  const size = sizes[st.point_size || 0];
  if (size) {
    const w = (size[1] / Math.max(1, b.width)) * 100;
    const h = (size[0] / Math.max(1, view.height)) * 100;
    marker.style.width = w + '%';
    marker.style.height = h + '%';
  }
}

// 預覽畫面對應到座標系的哪一段。座標系是 3:2，畫面通常是 16:9 —— 上下
// 各被裁掉一塊，只有中間那條看得見。
// 相機接受的對焦點範圍。
//
// 宣告的有效區 613 是**對焦框**能落在哪，而座標指的是框的中心 —— 所以中心
// 的可達範圍要向內縮半個框。實測三種框大小的四個邊界全部符合：
//   框 128 → y[149,533] x[160,864]   框 64 → y[117,565] x[128,896]
//   框 32  → y[101,581] x[112,912]
// 先前只夾到有效區，邊緣的點寫進去會再被相機往內拉，看起來就像對焦點
// 全擠在中間。
function reachable(b, sizeIndex) {
  const H = b.height || 682, W = b.width || 1024;
  const size = (b.point_sizes || [])[sizeIndex || 0] || [0, 0];
  const hy = Math.floor(size[0] / 2), hx = Math.floor(size[1] / 2);
  const top = (b.top !== undefined ? b.top : 0) + hy;
  const bottom = (b.bottom !== undefined ? b.bottom : H) - hy;
  const left = (b.left !== undefined ? b.left : 0) + hx;
  const right = (b.right !== undefined ? b.right : W) - hx;
  return {top: top, bottom: Math.max(top, bottom),
          left: left, right: Math.max(left, right)};
}

function visibleSpan(b) {
  const H = b.height || 682, W = b.width || 1024;
  const img = $('liveview');
  const r = img ? img.getBoundingClientRect() : null;
  const aspect = (r && r.height) ? (r.width / r.height) : (16 / 9);
  const visible = Math.min(H, W / aspect);
  return {height: visible, top: (H - visible) / 2};
}

function onLiveviewClick(ev) {
  if (!tapFocus || !focusBounds) return;
  const img = $('liveview');
  const r = img.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const fx = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const fy = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));

  // 點到哪就是哪 —— 用完整座標系換算，再夾進相機宣告的有效區域。
  // 先前是把整個畫面映射到有效區域，那會讓點擊位置系統性地偏移。
  const b = focusBounds.point || {};
  const W = b.width || 1024;
  const view = visibleSpan(b);
  const lim = reachable(b, st.point_size || 0);
  // 垂直方向只映射畫面看得到的那一段，再夾進可達範圍
  const y = Math.min(lim.bottom, Math.max(lim.top,
    Math.round(view.top + fy * view.height)));
  const x = Math.min(lim.right, Math.max(lim.left, Math.round(fx * W)));
  focusApply({point: [y, x]});
}

// ── 對焦控制 ──────────────────────────────────────────────────────
//
// 這幾項都在 DataGroupFocus 裡，但 bridge 一直沒把它們接出來。其中對焦模式
// 尤其重要：set_focus_position 每次都會強制寫 MF（不然相機會搶回焦點），
// 而在這個面板出現之前，沒有任何地方能寫回去 —— 拉一次滑桿就永遠停在手動。
let focusBounds = null, loadingBounds = false;

async function loadFocusBounds() {
  if (focusBounds || loadingBounds) return;
  loadingBounds = true;
  try {
    const r = await fetch('/api/focus/bounds');
    if (r.ok) {
      const d = await r.json();
      if (!d.error) { focusBounds = d; renderFocusControls(); renderTapFocus(); }
    }
  } catch (e) { /* 相機還沒好，下面會再試 */ }
  loadingBounds = false;
}

function focusApply(body) {
  markBusy();
  fetch('/api/focus/mode', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.json()).then(d => {
    if (d.error) { log('對焦設定失敗：' + d.error, 'err'); flash('err', d.error); return; }
    Object.assign(st, {
      focus_mode: d.focus_mode, face_eye_af: d.face_eye_af,
      focus_area: d.focus_area, focus_point: d.focus_point,
      continuous_af: d.continuous_af,
    });
    renderFocusControls();
  renderTapFocus();
  }).catch(e => log('對焦設定請求失敗：' + e, 'err'));
}

// 三項對焦設定併成一列。它們是同一件事的三個面向，而且選項都短 ——
// 各佔一列會把對焦面板撐得比 live view 還高。
function focusGroup(name, label, current, choices, labels, locked) {
  const opts = choices.map(c =>
    '<button class="o' + (c === current ? ' on' : '') + '" data-focus="' + name +
    '" data-val="' + escapeHTML(c) + '"' + (locked ? ' disabled data-locked="1"' : '') +
    '>' + escapeHTML(labels[c] || c) + '</button>').join('');
  return '<span class="grp"><span class="grp-label">' + escapeHTML(label) + '</span>' +
    opts + '</span>';
}

function renderFocusControls() {
  const box = $('focus-controls');
  if (!box) return;
  if (!focusBounds) {
    // 相機連上之前呼叫會失敗，而先前只在連線事件時試一次 —— 失敗就永遠
    // 停在「載入中」。這裡每次 render 都補一次，成功後就不再試。
    if (st.connected && !st.released) loadFocusBounds();
    setHTML(box, '<div class="hint">對焦選項載入中…</div>');
    return;
  }

  // 實測：MF 下相機會忽略對焦區域與臉眼偵測的寫入 —— 區域固定回單點，
  // 臉眼固定回 Off。合理（MF 的「區域」就是放大輔助的位置），但按了沒反應
  // 比按不下去更讓人困惑，所以直接標出來。
  const isMF = st.focus_mode === 'MF';
  const needAF = isMF ? '需切換成 AF 模式' : '';

  // 單點與臉眼本來就互斥：要嘛你指定位置，要嘛交給相機找臉。合併成一個
  // 控制項，多點不列 —— 它會把對焦點鎖在正中央，跟「點哪對哪」直接衝突，
  // 而這個 bridge 的對焦點就是靠單點運作的。
  const fm = FRIENDLY.focus_mode || {};
  const TARGETS = [
    {id: 'point', label: '單點', body: {face_eye_af: 'Off', focus_area: 'OnePointSelection'}},
    {id: 'FaceOnly', label: '僅臉部', body: {face_eye_af: 'FaceOnly'}},
    {id: 'FaceEyeAuto', label: '臉部+眼睛', body: {face_eye_af: 'FaceEyeAuto'}},
  ];
  const activeTarget = (st.face_eye_af && st.face_eye_af !== 'Off') ? st.face_eye_af : 'point';
  const targetLabel = (TARGETS.find(t => t.id === activeTarget) || {}).label || '—';
  const cur = [fm[st.focus_mode] || st.focus_mode, targetLabel].filter(Boolean).join(' · ');

  const notes = [];
  if (needAF) notes.push('MF 下對焦對象無效');
  if (st.camera_mode === 'movie') notes.push('CINE 下 AF-C 會變成 AF-S');

  const rows = [];
  rows.push('<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">對焦</span>' +
    '<span class="opt-cur">' + escapeHTML(cur || '—') + '</span>' +
    (notes.length ? '<span class="opt-note">' + escapeHTML(notes.join(' · ')) + '</span>' : '') +
    '</div><div class="opts">' +
    focusGroup('mode', '模式', st.focus_mode, focusBounds.focus_modes || [], fm, false) +
    '<span class="grp"><span class="grp-label">對焦對象</span>' +
    TARGETS.map(t => '<button class="o' + (t.id === activeTarget ? ' on' : '') +
      '" data-target="' + t.id + '"' + (isMF ? ' disabled data-locked="1"' : '') +
      '>' + t.label + '</button>').join('') + '</span>' +
    '</div></div>');

  // 對焦點沒有手動輸入 —— 在預覽上點比填座標直觀得多，而且座標系
  // （682×1024，3:2）跟畫面（16:9）對不上，填數字等於盲填。
  const pt = st.focus_point;
  const b = focusBounds.point || {};
  const sizes = b.point_sizes || [];
  const sizeOpts = sizes.map((sz, i) =>
    '<button class="o' + (i === (st.point_size || 0) ? ' on' : '') +
    '" data-focus="point_size" data-val="' + i + '">' + sz[1] + '×' + sz[0] +
    '</button>').join('');

  rows.push('<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">對焦點</span>' +
    '<span class="opt-cur">' + (pt && pt.length === 2 ? pt[0] + ', ' + pt[1] : '—') + '</span>' +
    '<span class="opt-note">' +
    (tapFocus ? '點預覽畫面移動（會自動切成單點選擇）' : '開啟上方「點選對焦」後點預覽畫面') +
    '</span></div>' +
    (sizeOpts ? '<div class="opts"><span class="grp">' +
      '<span class="grp-label">框大小</span>' + sizeOpts + '</span></div>' : '') +
    '</div>');

  const html = rows.join('');
  if (box.__last === html) return;
  box.innerHTML = html;
  box.__last = html;

  box.querySelectorAll('[data-target]').forEach(el => {
    const t = TARGETS.find(x => x.id === el.dataset.target);
    if (t) el.onclick = () => focusApply(t.body);
  });
  box.querySelectorAll('[data-focus]').forEach(el => {
    el.onclick = () => {
      const v = el.dataset.val;
      // point_size 是索引，要送數字；其餘是 enum 名稱
      focusApply({[el.dataset.focus]: el.dataset.focus === 'point_size' ? parseInt(v) : v});
    };
  });
}

function comboRow(byName, title, parts) {
  const present = parts.filter(([name]) => byName[name]);
  if (!present.length) return '';

  const summary = [], body = [];
  for (const [name, short] of present) {
    const s = byName[name];
    const cur = values[name];
    if (cur !== null && cur !== undefined && cur !== 'Null')
      summary.push(short + ' ' + labelFor(s, cur));
    // 相機宣告這一項現在不能設（能力清單是空的）—— 例如 CinemaDNG 下的
    // 電子防手震。照樣畫成可選的話，選了只會被機身默默忽略。
    const dis = s.writable === false ? ' disabled data-locked="1"' : '';
    body.push('<span class="grp"><span class="grp-label">' + short + '</span>' +
      '<select data-set="' + name + '"' + dis + '>' +
      optionsFor(usefulChoices(s), cur, c => labelFor(s, c)) + '</select></span>');
  }
  return '<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">' + escapeHTML(title) + '</span>' +
    '<span class="opt-cur">' + escapeHTML(summary.join(' · ') || '—') + '</span>' +
    '</div><div class="opts">' + body.join('') + '</div></div>';
}

// Null 是「相機沒有回報」的佔位，不是使用者可以選的東西 —— 顯示成 — 只會讓人
// 以為那是一個選項。除非目前值就是它（那要看得到自己在哪）。
function usefulChoices(setting) {
  const cur = values[setting.name];
  return (setting.choices || []).filter(c => c !== 'Null' || c === cur);
}

function wbRow(byName) {
  const wb = byName.white_balance, ct = byName.color_temp;
  if (!wb && !ct) return '';
  const curWb = values.white_balance;
  const curCt = values.color_temp;
  const byTemp = curWb === 'ColorTemp';

  const parts = [];
  if (curWb) parts.push(labelFor(wb || {name:'white_balance'}, curWb));
  if (byTemp && curCt !== null && curCt !== undefined) parts.push(curCt + 'K');

  let body = '';
  if (wb && wb.choices && wb.choices.length) {
    const v = curWb;
    body += '<span class="grp"><select data-set="white_balance">' +
      optionsFor(wb.choices, v, c => labelFor(wb, c)) + '</select></span>';
  }
  if (ct) {
    body += '<span class="grp"><input type="number" data-set="color_temp" step="100"' +
      lockedAttr(!byTemp) +
      ' title="' + escapeHTML(byTemp ? '色溫（K）' : '白平衡設成「色溫」時才能指定') + '"' +
      ' value="' + (curCt === null || curCt === undefined ? '' : curCt) + '"' +
      ' style="min-width:96px"></span>';
  }

  return '<div class="opt"><div class="opt-head">' +
    '<span class="opt-name">白平衡</span>' +
    '<span class="opt-cur">' + escapeHTML(parts.join(' · ') || '—') + '</span>' +
    (ct && !byTemp ? '<span class="opt-note">選「色溫」才能指定 K 值</span>' : '') +
    '</div><div class="opts">' + body + '</div></div>';
}

// 送出前依 schema 決定要不要轉成數字。白平衡之類的 enum 值是字串，
// 無條件 parseFloat 會變成 NaN，序列化後成 null 送出去 —— 選了沒反應。
// 按鈕與下拉必須共用同一套判斷，否則只要有一邊漏掉就會重演。
// 下拉的選中判定：先找精確命中，找不到就用最接近的（同樣的理由 ——
// 什麼都不選會讓欄位顯示「—」，看起來像讀不到值）。
function selectedValue(choices, current) {
  if (current === null || current === undefined) return null;
  for (const c of choices) if (String(c) === String(current)) return c;
  let best = null, bestErr = DISPLAY_EPSILON;
  const b = Number(current);
  if (isNaN(b) || b === 0) return null;
  for (const c of choices) {
    const a = Number(c);
    if (isNaN(a) || a === 0) continue;
    const err = Math.abs(a - b) / Math.max(Math.abs(a), Math.abs(b));
    if (err < bestErr) { bestErr = err; best = c; }
  }
  return best;
}

// 五個下拉共用：由 selectedValue() 決定哪一項標 selected。
function optionsFor(choices, current, label) {
  const sel = selectedValue(choices, current);
  return '<option value="">—</option>' + choices.map(c =>
    '<option value="' + c + '"' + (String(c) === String(sel) ? ' selected' : '') +
    '>' + escapeHTML(label(c)) + '</option>').join('');
}

function coerceValue(name, raw) {
  const s = (schema || []).find(x => x.name === name);
  const numeric = s && (!s.choices || typeof s.choices[0] === 'number');
  return numeric ? parseFloat(raw) : raw;
}

function settingsHTML() {
  if (!schema) return '<div class="hint">載入中…</div>';
  const byName = {};
  visibleSettings().forEach(s => byName[s.name] = s);
  const manual = values.exposure_mode === 'Manual';
  const rows = [];

  // 最上層：機身模式。實測可寫（DataGroupMovie tag 1），寫入後機身螢幕
  // 真的切換 —— 所以做成可按的按鈕，不是唯讀指示。
  const modeSetting = byName.capture_mode;
  if (modeSetting) {
    rows.push(optRow('capture_mode', '機身模式', {
      current: values.capture_mode,
      currentLabel: values.capture_mode === 1 ? 'STILL'
                  : values.capture_mode === 2 ? 'CINE' : '—',
      note: '切換會連帶改變快門表示法',
      choices: [
        {value: 1, label: 'STILL', title: '拍照模式'},
        {value: 2, label: 'CINE', title: '錄影模式'},
      ],
    }));
  } else {
    rows.push(optRow('__mode', '機身模式', {
      current: st.camera_mode || '',
      currentLabel: st.camera_mode === 'movie' ? 'CINE'
                  : st.camera_mode === 'stills' ? 'STILL' : '—',
      locked: true,
      note: '相機未回報，無法切換',
      choices: [
        {value: 'stills', label: 'STILL'},
        {value: 'movie', label: 'CINE'},
      ],
    }));
  }

  for (const [name, title] of ORDER) {
    if (name === '__format') { const r = formatRow(byName); if (r) rows.push(r); continue; }
    if (name === '__exposure') { const r = exposureRow(byName); if (r) rows.push(r); continue; }
    if (name === '__wb') { const r = wbRow(byName); if (r) rows.push(r); continue; }
    if (name === '__loc') {
      const r = comboRow(byName, '鏡頭校正', LOC_PARTS); if (r) rows.push(r); continue;
    }
    if (name === '__crop') {
      const r = comboRow(byName, title, CROP_PARTS); if (r) rows.push(r); continue;
    }
    const s = byName[name];
    if (!s) continue;
    const cur = values[name];

    if (s.choices && s.choices.length) {
      let choices = usefulChoices(s);
      const white = CHOICE_WHITELIST[name];
      if (white) {
        const w = choices.filter(v => white.indexOf(String(v)) >= 0 || String(v) === String(cur));
        if (w.length) choices = w;
      }
      const needsM = NEEDS_MANUAL[name] && !manual;
      // 相機宣告這一項現在不能設（能力清單是空的）。例如 CinemaDNG 下的
      // 電子防手震 —— fp 的電子防手震不支援 CinemaDNG，相機會把 810 的
      // 清單清空。照樣畫成可按的話，按下去只會被機身默默忽略。
      const unavail = s.writable === false;
      // 沒有單位也沒有標籤的整數選項 —— 我們知道相機接受這些值，
      // 但不知道它們代表什麼。與其讓使用者對著 1 / 2 猜，不如直說。
      const opaque = s.kind === 'int' && !s.unit && !s.labels &&
                     !(FRIENDLY[name]) && (s.choices || []).every(v => typeof v === 'number');
      rows.push(optRow(name, title, {
        current: cur,
        currentLabel: cur === null || cur === undefined ? '—' : labelFor(s, cur),
        disabled: needsM || unavail,
        note: unavail ? '目前的格式／模式下相機不開放'
              : needsM ? '需切換成 M 模式'
              : opaque ? '數值意義尚未確認'
              : (s.inferred_labels ? '? = 推測未確認' : ''),
        choices: choices.map(v => ({value: v, label: labelFor(s, v)})),
      }));
    } else {
      // 沒有離散選項的（色溫）維持數字輸入
      rows.push('<div class="opt"><div class="opt-head">' +
        '<span class="opt-name">' + title + '</span>' +
        '<span class="opt-cur">' + (cur === null || cur === undefined ? '—' : cur) + '</span></div>' +
        '<div class="opts"><input type="number" data-set="' + name + '" ' +
        'value="' + (cur === null || cur === undefined ? '' : cur) + '" style="min-width:110px"></div></div>');
    }
  }
  return rows.join('');
}

function renderSettings() {
  if (!schema) return;
  const html = settingsHTML();
  const box = $('settings');
  if (box.__last !== html) {
    // 重建前記住捲動位置，免得使用者剛捲到的地方被重設
    const scrolls = {};
    box.querySelectorAll('.opts.scroll').forEach((el, i) => scrolls[i] = el.scrollLeft);
    box.innerHTML = html;
    box.__last = html;
    box.querySelectorAll('.opts.scroll').forEach((el, i) => {
      if (scrolls[i] !== undefined) el.scrollLeft = scrolls[i];
      else { const on = el.querySelector('.o.on'); if (on) on.scrollIntoView({block:'nearest', inline:'center'}); }
    });
    box.querySelectorAll('.o[data-set]').forEach(b => {
      b.onclick = () => {
        if (b.dataset.set === '__mode') return;
        markBusy();
        send({cmd: 'set_settings',
              settings: {[b.dataset.set]: coerceValue(b.dataset.set, b.dataset.val)}});
      };
    });
    box.querySelectorAll('.o[data-unit]').forEach(b => {
      b.onclick = () => setShutterUnit(b.dataset.unit);
    });
    box.querySelectorAll('select[data-set]').forEach(el => {
      el.onchange = () => {
        if (el.value === '') return;
        markBusy();
        send({cmd: 'set_settings',
              settings: {[el.dataset.set]: coerceValue(el.dataset.set, el.value)}});
      };
    });
    box.querySelectorAll('input[data-set]').forEach(el => {
      el.onchange = () => {
        if (el.value === '') return;
        markBusy();
        send({cmd: 'set_settings',
              settings: {[el.dataset.set]: coerceValue(el.dataset.set, el.value)}});
      };
    });
  }
  renderNotices();
}

function setShutterUnit(u) {
  shutterUnit = u;
  renderSettings();
}

// ── 錄影 ──────────────────────────────────────────────────────────
function toggleRec() { send({cmd: st.recording ? 'record_stop' : 'record_start'}); }


// ── 校準 ──────────────────────────────────────────────────────────

function doRelease() {
  if (st.recording && !confirm('正在錄影中，交還前會先停止錄影。繼續？')) return;
  send({cmd: 'release'});
}

render();
connect();
setInterval(() => { if (st.connected && !st.released && !st.recording) send({cmd: 'capture_status'}); }, 5000);
</script>
</body>
</html>
